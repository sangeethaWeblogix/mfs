name: Regenerate url.csv

on:
  schedule:
    # 03:00 UTC daily (~1pm/2pm AEST/AEDT) — keeps the indexed-URL list in
    # sync with real inventory (new makes, vehicle makes, etc.) without
    # relying on someone remembering to regenerate it by hand.
    - cron: "0 3 * * *"
  workflow_dispatch: {} # allows manually triggering a run from the Actions tab

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Regenerate url.csv
        env:
          NEXT_PUBLIC_MFS_API_BASE: ${{ secrets.NEXT_PUBLIC_MFS_API_BASE }}
          MFS_API_KEY: ${{ secrets.MFS_API_KEY }}
          NEXT_PUBLIC_SITE_URL: https://www.motorhomesforsale.com.au
        run: node scripts/regenerate-url-csv.mjs

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- src/app/url.csv; then
            echo "No changes to url.csv — nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/app/url.csv
          git commit -m "chore: regenerate url.csv from live sitemap data"
          git push
